# Testes usam H2 em memória: não precisam do MySQL.
spring.datasource.url=jdbc:h2:mem:smartstock;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

smartstock.dias-alerta=10
smartstock.seguranca.usuario=admin
smartstock.seguranca.senha=senha-de-teste
smartstock.notificacao.email.ativo=false
smartstock.fuso=America/Sao_Paulo
smartstock.desconto.faixas=2:50,5:30,10:10
smartstock.somente-leitura=false
