# Banco de dados (MySQL). Defina DB_PASSWORD no ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_stock_market?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Em produção, prefira migrações (Flyway/Liquibase) no lugar de "update"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Janela (em dias) para os alertas de validade
smartstock.dias-alerta=10
