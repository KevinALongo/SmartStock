# ---------- Banco de dados (MySQL) ----------
# Defina DB_PASSWORD no ambiente; nunca versione a senha.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_stock_market?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# "update" cria/ajusta as tabelas (bom para banco novo). Em banco EXISTENTE use DDL_AUTO=none (ou validate).
# Em produção, prefira migrações (Flyway/Liquibase) no lugar de "update".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# ---------- Usando um banco existente ----------
# Nomes reais das tabelas/colunas (padrão = os nomes abaixo). Só descomente o que for diferente no seu banco.
# Tabelas: produtos, lotes
#smartstock.banco.nomes.produtos=tb_produto
#smartstock.banco.nomes.lotes=tb_lote_estoque
# Colunas de produtos: pk_produto (chave, padrão id), codigo_barras, nome, categoria, preco_original, estoque_minimo
#smartstock.banco.nomes.pk_produto=cod_produto
#smartstock.banco.nomes.codigo_barras=ean
#smartstock.banco.nomes.preco_original=preco_venda
# Colunas de lotes: pk_lote (chave, padrão id), produto_id, quantidade_atual, data_validade
#smartstock.banco.nomes.produto_id=cod_produto
#smartstock.banco.nomes.quantidade_atual=qtd
#smartstock.banco.nomes.data_validade=validade
# true = a API só consulta e avisa (GET e /api/avisos/enviar); bloqueia cadastro, entrada, baixa e exclusão.
smartstock.somente-leitura=${SOMENTE_LEITURA:false}

# ---------- Autenticação da API (HTTP Basic) ----------
# APP_SENHA é obrigatória (mínimo 8 caracteres). APP_USUARIO é opcional (padrão: admin).
smartstock.seguranca.usuario=${APP_USUARIO:admin}
smartstock.seguranca.senha=${APP_SENHA}

# ---------- Fuso horário ----------
# Todas as datas ("hoje", validade, aviso diário) usam este fuso, não o do servidor.
smartstock.fuso=${APP_FUSO:America/Sao_Paulo}

# ---------- Desconto por validade ----------
# Formato: diasAte:percentual, em ordem crescente. Padrão: até 2 dias 50%, até 5 dias 30%, até 10 dias 10%.
# Use "nenhuma" para desligar o desconto.
smartstock.desconto.faixas=${DESCONTO_FAIXAS:2:50,5:30,10:10}

# ---------- Alertas ----------
# Janela (em dias) para os alertas de validade (nunca menor que a maior faixa de desconto)
smartstock.dias-alerta=10
# Horário do aviso diário (cron do Spring, no fuso smartstock.fuso): todo dia às 8h
smartstock.notificacao.cron=0 0 8 * * *

# ---------- Notificação por e-mail ----------
# Desligada por padrão: os alertas vão só para o log. Para ligar, defina:
#   NOTIFICACAO_EMAIL_ATIVO=true, EMAIL_DESTINATARIO, EMAIL_REMETENTE (opcional),
#   SPRING_MAIL_HOST, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
smartstock.notificacao.email.ativo=${NOTIFICACAO_EMAIL_ATIVO:false}
smartstock.notificacao.email.para=${EMAIL_DESTINATARIO:}
smartstock.notificacao.email.de=${EMAIL_REMETENTE:}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
